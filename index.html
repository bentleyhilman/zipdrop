<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipDrop</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Android Web App / PWA Manifest & Icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" sizes="192x192" href="android.png">

    <!-- Apple Web App / iOS Safari Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ZipDrop">
    <link rel="apple-touch-icon" href="apple.png">
    <link rel="apple-touch-icon" sizes="152x152" href="apple.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple.png">
    <link rel="apple-touch-icon" sizes="167x167" href="apple.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for serverless WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- QRCode.js for generating QR Codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#F1E9DB',
                        text: '#2E3138',
                        accent: '#588B8B',
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                        mono: ['ui-monospace', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F1E9DB;
            color: #2E3138;
            -webkit-font-smoothing: antialiased;
        }
        
        .panel {
            border: 2px solid #2E3138;
            background-color: #F1E9DB;
        }

        .btn-accent {
            background-color: #588B8B;
            color: #F1E9DB;
            border: 2px solid #2E3138;
            transition: opacity 0.2s;
        }
        .btn-accent:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background-color: transparent;
            color: #2E3138;
            border: 2px solid #2E3138;
            transition: background-color 0.2s;
        }
        .btn-outline:hover {
            background-color: rgba(46, 49, 56, 0.05);
        }

        .input-box {
            border: 2px solid #2E3138;
            background-color: transparent;
            color: #2E3138;
            outline: none;
        }
        .input-box:focus {
            border-color: #588B8B;
        }

        /* Toggle Switch Styles */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: transparent;
            border: 2px solid #2E3138;
            transition: .2s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: #2E3138;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #588B8B;
            border-color: #2E3138;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #F1E9DB;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 0px; }

        .drag-active {
            background-color: rgba(88, 139, 139, 0.1) !important;
            border-color: #588B8B !important;
            border-style: dashed !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pt-12 px-4 pb-12">

    <!-- Header -->
    <header class="w-full max-w-2xl flex justify-between items-end mb-12">
        <h1 class="text-4xl font-bold tracking-tight cursor-pointer hover:opacity-80 transition" onclick="resetApp()">ZipDrop</h1>
        <span id="global-status" class="text-sm font-semibold opacity-70">Ready</span>
    </header>

    <main id="app-container" class="w-full max-w-2xl">

        <!-- VIEW: HOME -->
        <div id="view-home" class="flex flex-col gap-8 w-full">
            <!-- Join Code Input -->
            <div class="flex gap-3 h-14">
                <input type="text" id="join-code-input" placeholder="Enter 3-character code" maxlength="3" class="input-box w-full h-full px-4 text-lg font-mono uppercase tracking-widest text-center font-bold">
                <button onclick="joinCode()" class="btn-accent h-full px-8 font-bold text-lg">Join</button>
            </div>

            <!-- Creation Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <button onclick="initSetup('group')" class="panel p-6 text-left hover:bg-[#2E3138]/5 transition group">
                    <h2 class="text-xl font-bold mb-2">Groups</h2>
                    <p class="text-sm opacity-80">Create a shared room for chat and multi-user file drops.</p>
                </button>

                <button onclick="initSetup('quick')" class="panel p-6 text-left hover:bg-[#2E3138]/5 transition">
                    <h2 class="text-xl font-bold mb-2">Quick Share</h2>
                    <p class="text-sm opacity-80">Upload one file. Instantly downloads when code is entered.</p>
                </button>

                <button onclick="initSetup('device')" class="panel p-6 text-left hover:bg-[#2E3138]/5 transition">
                    <h2 class="text-xl font-bold mb-2">Device Link</h2>
                    <p class="text-sm opacity-80">Persistent 1-to-1 link for instant back-and-forth drops.</p>
                </button>

                <button onclick="initSetup('mega')" class="panel p-6 text-left hover:bg-[#2E3138]/5 transition">
                    <h2 class="text-xl font-bold mb-2">Mega Transfer</h2>
                    <p class="text-sm opacity-80">Select many files. Automatically sends all at once.</p>
                </button>

            </div>
        </div>

        <!-- VIEW: HOST SETUP (File Selection & Waiting for Quick/Mega/Device) -->
        <div id="view-setup" class="hidden flex flex-col gap-6 w-full">
            <div class="flex justify-between items-center mb-2">
                <h2 id="setup-title" class="text-2xl font-bold">Setup</h2>
                <button onclick="resetApp()" class="text-sm font-bold opacity-60 hover:opacity-100 transition">Cancel</button>
            </div>

            <!-- File Input Area (For Quick/Mega) -->
            <div id="setup-file-area" class="hidden flex flex-col gap-4">
                <label for="host-file-input" class="panel p-10 flex flex-col items-center justify-center cursor-pointer hover:bg-[#2E3138]/5 transition border-dashed">
                    <span class="font-bold text-lg mb-1" id="setup-file-label">Select File</span>
                    <input type="file" id="host-file-input" class="hidden" onchange="handleSetupFiles(event)">
                </label>
                <div id="setup-selected-files" class="text-sm font-mono opacity-80"></div>
                <button id="setup-start-btn" onclick="startHostSession()" class="btn-accent py-3 font-bold hidden">Generate Code</button>
            </div>

            <!-- Code Display Area (Waiting) -->
            <div id="setup-waiting-area" class="hidden panel p-8 flex flex-col items-center justify-center text-center">
                <p class="text-sm font-bold opacity-70 uppercase tracking-widest mb-1">Your Code</p>
                <p id="display-code" class="text-6xl font-mono font-bold tracking-widest text-accent mb-4">---</p>
                
                <!-- QR Code displays here for non-groups -->
                <div id="setup-qr-container" class="mb-4 p-3 bg-white border-2 border-text hidden"></div>

                <p id="waiting-msg" class="text-sm font-semibold mb-6">Waiting for device to connect...</p>

                <!-- Keep Screen Awake Toggle Switch (Appears during transfers/waiting) -->
                <div class="w-full pt-4 border-t-2 border-text/20 flex items-center justify-between px-2">
                    <span class="text-xs font-bold uppercase tracking-wider opacity-80">Keep Screen Awake</span>
                    <label class="switch">
                        <input type="checkbox" id="wakelock-toggle" onchange="toggleWakeLock(this)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- VIEW: ACTIVE GROUP -->
        <div id="view-group" class="hidden flex flex-col h-[75vh] panel w-full overflow-hidden">
            <div class="p-4 border-b-2 border-text flex justify-between items-center bg-[#2E3138]/5">
                <span class="font-bold cursor-pointer hover:opacity-70 transition flex items-center gap-2" onclick="showQRModal()">
                    Group: <span id="group-code-header" class="font-mono text-accent uppercase underline decoration-2 underline-offset-4"></span>
                </span>
                <button onclick="resetApp()" class="text-sm font-bold opacity-70 hover:opacity-100 transition">Leave</button>
            </div>
            
            <div class="flex-grow flex flex-col sm:flex-row overflow-hidden">
                <!-- Chat Area -->
                <div class="flex-grow flex flex-col border-b-2 sm:border-b-0 sm:border-r-2 border-text h-1/2 sm:h-full">
                    <div id="group-chat-log" class="flex-grow p-4 overflow-y-auto flex flex-col gap-3"></div>
                    <div class="flex border-t-2 border-text">
                        <input type="text" id="group-chat-input" placeholder="Message..." class="input-box border-none w-full p-3 font-medium">
                        <button onclick="sendGroupChat()" class="btn-accent border-none border-l-2 px-6 font-bold">Send</button>
                    </div>
                </div>

                <!-- Files Area -->
                <div class="w-full sm:w-72 flex flex-col h-1/2 sm:h-full bg-[#F1E9DB]">
                    <div class="p-3 border-b-2 border-text font-bold text-sm bg-[#2E3138]/5">Shared Files</div>
                    <div id="group-file-log" class="flex-grow p-3 overflow-y-auto flex flex-col gap-3"></div>
                    <label class="btn-outline border-none border-t-2 p-3 text-center cursor-pointer font-bold block bg-[#F1E9DB]">
                        Upload File
                        <input type="file" class="hidden" onchange="sendGroupFile(event)">
                    </label>
                </div>
            </div>
        </div>

        <!-- VIEW: DEVICE LINK -->
        <div id="view-device-link" class="hidden flex flex-col h-[65vh] w-full">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Device Link Active</h2>
                <button onclick="resetApp()" class="text-sm font-bold opacity-60 hover:opacity-100 transition">Disconnect</button>
            </div>
            <label id="device-dropzone" class="panel flex-grow flex flex-col items-center justify-center cursor-pointer hover:bg-[#2E3138]/5 transition relative">
                <input type="file" class="hidden" multiple onchange="sendDeviceLinkFile(event)">
                <span class="text-2xl font-bold mb-2">Drop Files Here</span>
                <span class="text-sm font-semibold opacity-70">Transfers instantly to linked device</span>
            </label>
            <div id="device-link-log" class="mt-4 flex flex-col gap-2 h-28 overflow-y-auto font-mono text-sm"></div>

            <!-- Keep Screen Awake Toggle Switch for Device Link -->
            <div class="panel mt-4 p-3 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider opacity-80">Keep Screen Awake</span>
                <label class="switch">
                    <input type="checkbox" id="wakelock-toggle-device" onchange="toggleWakeLock(this)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

    </main>

    <!-- MODAL: Enter Name -->
    <div id="name-modal" class="hidden fixed inset-0 bg-[#F1E9DB]/90 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="panel p-8 flex flex-col items-center max-w-sm w-full mx-4">
            <h3 class="text-xl font-bold mb-2">Join Group</h3>
            <p class="text-sm opacity-70 mb-6 text-center">Enter a name so others know who you are.</p>
            <input type="text" id="username-input" class="input-box p-3 mb-4 w-full text-center font-bold text-lg" placeholder="Your Name" maxlength="16">
            <button onclick="submitName()" class="btn-accent px-6 py-3 font-bold w-full text-lg">Continue</button>
        </div>
    </div>

    <!-- MODAL: Group QR Code -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-[#F1E9DB]/90 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="panel p-8 flex flex-col items-center max-w-sm w-full mx-4">
            <h3 class="text-xl font-bold mb-2">Group QR Code</h3>
            <p class="text-sm opacity-70 mb-6 text-center">Scan to instantly join this group.</p>
            <div id="modal-qr-container" class="mb-6 p-4 bg-white border-2 border-text shadow-sm"></div>
            <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="btn-outline px-6 py-2 font-bold w-full">Close</button>
        </div>
    </div>

    <script>
        // --- Core State ---
        const PREFIX = 'zpdrp-v3-';
        let peer = null;
        let connections = []; 
        let currentMode = null; 
        let currentCode = null;
        let isHost = false;
        let pendingFiles = [];
        
        let myUsername = 'Anonymous';
        let nameCallback = null;

        // Wake Lock Reference
        let wakeLockSentinel = null;

        // Detect iPhone / iOS
        function isiPhone() {
            return /iPhone|iPad|iPod/i.test(navigator.userAgent) || 
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        async function handleImageSave(blob, filename) {
            if (isiPhone() && navigator.canShare) {
                const file = new File([blob], filename, { type: blob.type });
                if (navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: filename,
                        });
                        return true;
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error('Share error:', err);
                        }
                    }
                }
            }
            return false;
        }

        async function toggleWakeLock(checkbox) {
            if (checkbox.checked) {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLockSentinel = await navigator.wakeLock.request('screen');
                        wakeLockSentinel.addEventListener('release', () => {
                            wakeLockSentinel = null;
                            document.getElementById('wakelock-toggle').checked = false;
                            document.getElementById('wakelock-toggle-device').checked = false;
                        });
                    } else {
                        alert('Screen Wake Lock is not supported by your browser.');
                        checkbox.checked = false;
                    }
                } catch (err) {
                    checkbox.checked = false;
                }
            } else {
                if (wakeLockSentinel) {
                    await wakeLockSentinel.release();
                    wakeLockSentinel = null;
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLockSentinel !== null && document.visibilityState === 'visible') {
                try {
                    wakeLockSentinel = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        });

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const codeParam = params.get('code');
            if (codeParam && codeParam.length === 3) {
                document.getElementById('join-code-input').value = codeParam.toLowerCase();
                joinCode();
            }
        };

        function showView(viewId) {
            document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function setStatus(msg) {
            document.getElementById('global-status').innerText = msg;
        }

        async function resetApp() {
            if (wakeLockSentinel) {
                await wakeLockSentinel.release();
                wakeLockSentinel = null;
            }
            document.getElementById('wakelock-toggle').checked = false;
            document.getElementById('wakelock-toggle-device').checked = false;

            if (peer) peer.destroy();
            connections = [];
            currentMode = null;
            currentCode = null;
            isHost = false;
            pendingFiles = [];
            document.getElementById('join-code-input').value = '';
            document.getElementById('setup-selected-files').innerHTML = '';
            document.getElementById('group-chat-log').innerHTML = '';
            document.getElementById('group-file-log').innerHTML = '';
            document.getElementById('device-link-log').innerHTML = '';
            document.getElementById('name-modal').classList.add('hidden');
            document.getElementById('qr-modal').classList.add('hidden');
            setStatus('Ready');
            window.history.replaceState({}, document.title, window.location.pathname);
            showView('view-home');
        }

        function promptName(callback) {
            document.getElementById('username-input').value = '';
            document.getElementById('name-modal').classList.remove('hidden');
            document.getElementById('username-input').focus();
            nameCallback = callback;
        }

        function submitName() {
            const input = document.getElementById('username-input');
            let name = input.value.trim();
            if (name) myUsername = name;
            document.getElementById('name-modal').classList.add('hidden');
            if (nameCallback) nameCallback();
        }

        document.getElementById('username-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitName();
        });

        function generateRandomCode() {
            return Math.random().toString(36).substring(2, 5).toLowerCase();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function triggerPopup(msg) {
            alert(msg);
        }

        function addLog(containerId, html) {
            const container = document.getElementById(containerId);
            const el = document.createElement('div');
            el.innerHTML = html;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function generateQR(containerId, codeText) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const url = window.location.origin + window.location.pathname + '?code=' + codeText;
            new QRCode(container, {
                text: url,
                width: 130,
                height: 130,
                colorDark: "#2E3138",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function showQRModal() {
            if (currentCode) {
                generateQR('modal-qr-container', currentCode);
                document.getElementById('qr-modal').classList.remove('hidden');
            }
        }

        function initSetup(mode) {
            currentMode = mode;
            isHost = true;
            pendingFiles = [];
            document.getElementById('setup-start-btn').classList.add('hidden');
            document.getElementById('setup-selected-files').innerHTML = '';
            
            if (mode === 'group') {
                promptName(() => {
                    showView('view-setup');
                    document.getElementById('setup-file-area').classList.add('hidden');
                    document.getElementById('setup-title').innerText = 'Start Group';
                    startHostSession();
                });
            } else if (mode === 'device') {
                showView('view-setup');
                document.getElementById('setup-file-area').classList.add('hidden');
                document.getElementById('setup-title').innerText = 'Start Device Link';
                startHostSession();
            } else {
                showView('view-setup');
                document.getElementById('setup-title').innerText = mode === 'quick' ? 'Quick Share' : 'Mega Transfer';
                document.getElementById('setup-file-area').classList.remove('hidden');
                document.getElementById('setup-waiting-area').classList.add('hidden');
                
                const fileInput = document.getElementById('host-file-input');
                fileInput.multiple = (mode === 'mega');
                document.getElementById('setup-file-label').innerText = mode === 'mega' ? 'Select Multiple Files' : 'Select One File';
            }
        }

        function handleSetupFiles(event) {
            pendingFiles = Array.from(event.target.files);
            if (pendingFiles.length > 0) {
                document.getElementById('setup-start-btn').classList.remove('hidden');
                const names = pendingFiles.map(f => f.name).join('<br>');
                document.getElementById('setup-selected-files').innerHTML = `${pendingFiles.length} file(s) selected:<br>${names}`;
            }
        }

        function startHostSession() {
            document.getElementById('setup-file-area').classList.add('hidden');
            document.getElementById('setup-waiting-area').classList.remove('hidden');
            document.getElementById('display-code').innerText = '...';
            document.getElementById('setup-qr-container').classList.add('hidden');
            setStatus('Generating Code...');

            currentCode = generateRandomCode();
            peer = new Peer(PREFIX + currentCode);

            peer.on('open', (id) => {
                document.getElementById('display-code').innerText = currentCode;
                setStatus('Hosting');
                
                if (currentMode === 'group') {
                    document.getElementById('group-code-header').innerText = currentCode;
                    showView('view-group');
                    addLog('group-chat-log', `<div class="text-xs font-bold opacity-50 text-center my-2">Group created by ${myUsername}</div>`);
                } else {
                    document.getElementById('setup-qr-container').classList.remove('hidden');
                    generateQR('setup-qr-container', currentCode);
                }
            });

            peer.on('connection', (conn) => {
                connections.push(conn);
                setupHostConnectionLogic(conn);
            });

            peer.on('error', (err) => {
                triggerPopup('Error creating code, please try again.');
                resetApp();
            });
        }

        function setupHostConnectionLogic(conn) {
            conn.on('open', () => {
                conn.send({ type: 'handshake', mode: currentMode });

                if (currentMode === 'quick') {
                    sendFileRaw(conn, pendingFiles[0]);
                    document.getElementById('waiting-msg').innerText = "File Sent!";
                    setTimeout(resetApp, 2000); 
                } 
                else if (currentMode === 'mega') {
                    document.getElementById('waiting-msg').innerText = `Sending ${pendingFiles.length} files...`;
                    pendingFiles.forEach(f => sendFileRaw(conn, f));
                    document.getElementById('waiting-msg').innerText = "All Files Sent!";
                    setTimeout(resetApp, 3000);
                }
                else if (currentMode === 'device') {
                    showView('view-device-link');
                    setupDeviceLinkDragDrop(conn);
                }
            });

            conn.on('data', (data) => {
                handleIncomingData(conn, data);
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                if (currentMode === 'device') resetApp(); 
                if (currentMode === 'group') {
                    addLog('group-chat-log', `<div class="text-xs font-bold opacity-50 text-center my-2">A user disconnected</div>`);
                }
            });
        }

        function joinCode() {
            const code = document.getElementById('join-code-input').value.trim().toLowerCase();
            if (code.length !== 3) return;

            currentCode = code;
            setStatus('Connecting...');
            document.getElementById('join-code-input').value = '...';
            isHost = false;

            peer = new Peer();
            peer.on('open', () => {
                const conn = peer.connect(PREFIX + code);
                connections = [conn];

                conn.on('open', () => {
                    setStatus('Connected');
                });

                conn.on('data', (data) => {
                    handleIncomingData(conn, data);
                });

                conn.on('close', () => {
                    triggerPopup('Session closed by host.');
                    resetApp();
                });
            });

            peer.on('error', (err) => {
                triggerPopup('Invalid code or connection failed.');
                resetApp();
            });
        }

        async function handleIncomingData(sourceConn, data) {
            if (data.type === 'handshake') {
                currentMode = data.mode;
                if (currentMode === 'quick' || currentMode === 'mega') {
                    setStatus('Receiving...');
                    document.getElementById('join-code-input').value = 'Receiving...';
                }
                else if (currentMode === 'device') {
                    showView('view-device-link');
                    setupDeviceLinkDragDrop(sourceConn);
                }
                else if (currentMode === 'group') {
                    promptName(() => {
                        document.getElementById('group-code-header').innerText = currentCode;
                        showView('view-group');
                        sourceConn.send({ type: 'system', msg: `${myUsername} joined the group` });
                    });
                }
                return;
            }

            if (data.type === 'system') {
                if (isHost && currentMode === 'group') {
                    connections.forEach(c => { if(c !== sourceConn) c.send(data); });
                }
                addLog('group-chat-log', `<div class="text-[11px] font-bold opacity-60 text-center my-2">${data.msg}</div>`);
            }

            if (data.type === 'chat') {
                if (isHost && currentMode === 'group') {
                    connections.forEach(c => { if(c !== sourceConn) c.send(data); });
                }
                
                const isSelf = data.sender === myUsername;
                addLog('group-chat-log', `
                    <div class="flex flex-col w-fit max-w-[85%] ${isSelf ? 'self-end items-end' : 'self-start items-start'}">
                        <span class="text-[10px] font-bold opacity-60 mb-0.5 px-1">${data.sender}</span>
                        <div class="p-2 border-2 border-[#2E3138] rounded-md ${isSelf ? 'bg-accent text-[#F1E9DB]' : 'bg-[#F1E9DB] text-[#2E3138]'}">
                            ${data.msg}
                        </div>
                    </div>
                `);
            }

            if (data.type === 'file') {
                const blob = new Blob([data.buffer], { type: data.mime });
                const isImage = data.mime && data.mime.startsWith('image/');
                
                if (currentMode === 'quick' || currentMode === 'mega') {
                    let savedToPhotos = false;
                    if (isImage && isiPhone()) {
                        savedToPhotos = await handleImageSave(blob, data.name);
                    }
                    if (!savedToPhotos) {
                        downloadBlob(blob, data.name);
                    }
                    document.getElementById('join-code-input').value = 'Done!';
                    setTimeout(() => { if(!isHost) resetApp(); }, 2000);
                }
                else if (currentMode === 'device') {
                    addLog('device-link-log', `Received: ${data.name}`);
                    let savedToPhotos = false;
                    if (isImage && isiPhone()) {
                        savedToPhotos = await handleImageSave(blob, data.name);
                    }
                    if (!savedToPhotos) {
                        downloadBlob(blob, data.name);
                    }
                    triggerPopup(`Received file: ${data.name}`);
                }
                else if (currentMode === 'group') {
                    if (isHost) {
                        connections.forEach(c => { if(c !== sourceConn) c.send(data); });
                    }
                    const url = URL.createObjectURL(blob);
                    
                    let actionHtml = `<a href="${url}" download="${data.name}" class="btn-accent text-center text-[11px] py-1 px-3 font-bold">Download</a>`;
                    
                    addLog('group-file-log', `
                        <div class="p-2 border-2 border-[#2E3138] flex flex-col gap-1 bg-[#2E3138]/5 rounded-md">
                            <span class="font-bold text-xs truncate">${data.name}</span>
                            <span class="text-[10px] font-bold opacity-70">Shared by ${data.sender}</span>
                            <div class="flex justify-between items-end mt-1">
                                <span class="font-mono text-[10px] font-bold opacity-80">${formatBytes(data.size)}</span>
                                <div id="file-action-${data.name.replace(/[^a-zA-Z0-9]/g, '_')}-${Math.random()}">${actionHtml}</div>
                            </div>
                        </div>
                    `);

                    // Inject iPhone Save to Photos button if applicable
                    if (isImage && isiPhone()) {
                        const lastFileLog = document.getElementById('group-file-log').lastElementChild;
                        const actionContainer = lastFileLog.querySelector('div > div:last-child');
                        if (actionContainer) {
                            const saveBtn = document.createElement('button');
                            saveBtn.className = "btn-outline text-center text-[11px] py-1 px-3 font-bold mr-1";
                            saveBtn.innerText = "Save to Photos";
                            saveBtn.onclick = () => handleImageSave(blob, data.name);
                            actionContainer.insertBefore(saveBtn, actionContainer.firstChild);
                        }
                    }
                }
            }
        }

        function sendFileRaw(conn, file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                conn.send({
                    type: 'file',
                    name: file.name,
                    size: file.size,
                    mime: file.type,
                    sender: myUsername,
                    buffer: e.target.result
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function sendGroupChat() {
            const input = document.getElementById('group-chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            const packet = { type: 'chat', msg: msg, sender: myUsername };
            connections.forEach(c => c.send(packet));
            
            addLog('group-chat-log', `
                <div class="flex flex-col w-fit max-w-[85%] self-end items-end">
                    <span class="text-[10px] font-bold opacity-60 mb-0.5 px-1">${myUsername}</span>
                    <div class="p-2 border-2 border-[#2E3138] rounded-md bg-accent text-[#F1E9DB]">
                        ${msg}
                    </div>
                </div>
            `);
            input.value = '';
        }

        function sendGroupFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            connections.forEach(c => sendFileRaw(c, file));
            
            addLog('group-file-log', `
                <div class="p-2 border-2 border-[#2E3138] flex flex-col gap-1 bg-white rounded-md">
                    <span class="font-bold text-xs truncate">${file.name}</span>
                    <span class="text-[10px] font-bold opacity-70">Shared by you</span>
                </div>
            `);
        }

        function sendDeviceLinkFile(event) {
            const files = event.target.files;
            for(let file of files) {
                connections.forEach(c => sendFileRaw(c, file));
                addLog('device-link-log', `Sent: ${file.name}`);
            }
        }

        function setupDeviceLinkDragDrop(conn) {
            const dz = document.getElementById('device-dropzone');
            
            dz.ondragover = (e) => {
                e.preventDefault();
                dz.classList.add('drag-active');
            };
            dz.ondragleave = (e) => {
                e.preventDefault();
                dz.classList.remove('drag-active');
            };
            dz.ondrop = (e) => {
                e.preventDefault();
                dz.classList.remove('drag-active');
                if (e.dataTransfer.files) {
                    for(let file of e.dataTransfer.files) {
                        sendFileRaw(conn, file);
                        addLog('device-link-log', `Sent: ${file.name}`);
                    }
                }
            };
        }

        document.getElementById('group-chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendGroupChat();
        });
        document.getElementById('join-code-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') joinCode();
        });

    </script>
</body>
</html>
