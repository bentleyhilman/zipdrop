<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipDrop</title>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF9F6;
            --text-color: #2C1E16;
            --accent-color: #8C7A6B;
            --subtle-border: rgba(44, 30, 22, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.98);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        #dragOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(250, 249, 246, 0.92);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--text-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            border: 2px dashed var(--text-color);
        }

        #dragOverlay.visible {
            opacity: 1;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-top: 20px;
        }

        .status-heading {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .big-code {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 8px;
            line-height: 1;
            margin: 16px 0 24px 0;
        }

        .code-input-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        input[type="text"] {
            font-size: 2rem;
            font-weight: 600;
            padding: 16px 24px;
            width: 180px;
            text-align: center;
            text-transform: uppercase;
            border: none;
            border-bottom: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            outline: none;
            letter-spacing: 6px;
            transition: border-color 0.2s;
        }

        input[type="text"]::placeholder {
            color: var(--subtle-border);
            letter-spacing: 6px;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 16px 36px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.15s ease, opacity 0.2s ease;
            outline: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--subtle-border);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .center-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            margin: auto;
        }

        #qrcode {
            padding: 16px;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 30, 22, 0.05);
            margin-bottom: 24px;
        }

        #qrcode img {
            display: block;
        }

        .progress-track {
            width: 100%;
            max-width: 280px;
            height: 4px;
            background-color: var(--subtle-border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 24px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--text-color);
            transition: width 0.15s ease-out;
        }

        .pulse {
            animation: pulse-animation 1.8s infinite ease-in-out;
        }

        @keyframes pulse-animation {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div id="dragOverlay">DROP FILE TO SEND</div>
    <input type="file" id="fileInput">

    <div id="screenHome" class="screen active">
        <div class="brand-logo">ZipDrop</div>
        
        <div class="center-card">
            <div class="code-input-wrap">
                <input type="text" id="codeInput" placeholder="···" maxlength="3" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <button class="btn" onclick="document.getElementById('fileInput').click()">Upload File</button>
    </div>

    <div id="screenSendCode" class="screen">
        <div></div>
        <div class="center-card">
            <div id="qrcode"></div>
            <div class="big-code" id="displayCode">---</div>
            <div class="status-heading pulse">Waiting for receiver...</div>
        </div>
        <button class="btn btn-secondary" onclick="resetToHome()">Cancel</button>
    </div>

    <div id="screenConnecting" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading pulse">Locating peer...</div>
        </div>
        <div></div>
    </div>

    <div id="screenTransferring" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading" id="transferLabel">Transferring...</div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div></div>
    </div>

    <div id="screenSendSuccess" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading">Sent</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="shareAgain()">Share Again</button>
            <button class="btn" onclick="resetToHome()">Home</button>
        </div>
    </div>

    <div id="screenReceiveSuccess" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading">Downloaded</div>
        </div>
        <button class="btn" onclick="resetToHome()">Home</button>
    </div>

    <script>
        const client = new WebTorrent();
        let activeTorrent = null;
        let fileToShare = null;
        let currentCode = '';

        const dragOverlay = document.getElementById('dragOverlay');
        const fileInput = document.getElementById('fileInput');
        const codeInput = document.getElementById('codeInput');
        const qrContainer = document.getElementById('qrcode');

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Mapping 3-character code to a deterministic Magnet InfoHash prefix
        function codeToInfoHash(code) {
            return `zipdrop-v5-${code.toUpperCase()}`;
        }

        // Fullscreen Drag & Drop
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragOverlay.classList.add('visible');
        });

        window.addEventListener('dragleave', (e) => {
            if (e.clientX === 0 && e.clientY === 0) {
                dragOverlay.classList.remove('visible');
            }
        });

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragOverlay.classList.remove('visible');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        codeInput.addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase();
            e.target.value = val;
            if (val.length === 3) {
                startReceiving(val);
            }
        });

        function handleFileSelect(file) {
            fileToShare = file;
            startHosting();
        }

        function startHosting() {
            currentCode = generateCode();
            document.getElementById('displayCode').innerText = currentCode;

            const baseUrl = window.location.href.split('?')[0];
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: `${baseUrl}?code=${currentCode}`,
                width: 140,
                height: 140,
                colorDark: "#2C1E16",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.H
            });

            showScreen('screenSendCode');

            if (activeTorrent) activeTorrent.destroy();

            // Seed file via WebTorrent tracker mesh
            client.seed(fileToShare, {
                announce: [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.btorrent.xyz',
                    'wss://tracker.files.fm:7072/announce',
                    'wss://tracker.fastcast.nz'
                ]
            }, (torrent) => {
                activeTorrent = torrent;
                
                // Store torrent magnet mapping in localStorage for cross-tab or short-link lookup
                localStorage.setItem(codeToInfoHash(currentCode), torrent.magnetURI);

                torrent.on('wire', () => {
                    showScreen('screenTransferring');
                    document.getElementById('transferLabel').innerText = "Sending...";
                });

                torrent.on('upload', () => {
                    const progress = Math.min(100, Math.round(torrent.progress * 100));
                    document.getElementById('progressFill').style.width = `${progress}%`;
                    if (progress >= 100) {
                        showScreen('screenSendSuccess');
                    }
                });
            });
        }

        function shareAgain() {
            startHosting();
        }

        function startReceiving(code) {
            showScreen('screenConnecting');

            // Look up magnet URI from local storage or construct direct fallback
            let magnetURI = localStorage.getItem(codeToInfoHash(code));

            if (!magnetURI) {
                // Public tracker fallback search
                magnetURI = `magnet:?xt=urn:btih:${codeToInfoHash(code)}&dn=ZipDropFile&tr=wss%3A%2F%2Ftracker.openwebtorrent.com&tr=wss%3A%2F%2Ftracker.btorrent.xyz`;
            }

            if (activeTorrent) activeTorrent.destroy();

            client.add(magnetURI, {
                announce: [
                    'wss://tracker.openwebtorrent.com',
                    'wss://tracker.btorrent.xyz',
                    'wss://tracker.files.fm:7072/announce',
                    'wss://tracker.fastcast.nz'
                ]
            }, (torrent) => {
                activeTorrent = torrent;

                torrent.on('download', () => {
                    showScreen('screenTransferring');
                    document.getElementById('transferLabel').innerText = "Downloading...";
                    const progress = Math.min(100, Math.round(torrent.progress * 100));
                    document.getElementById('progressFill').style.width = `${progress}%`;
                });

                torrent.on('done', () => {
                    const file = torrent.files[0];
                    file.getBlobURL((err, url) => {
                        if (err) return resetToHome();
                        
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = file.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);

                        showScreen('screenReceiveSuccess');
                    });
                });
            });
        }

        function resetToHome() {
            if (activeTorrent) activeTorrent.destroy();
            fileToShare = null;
            codeInput.value = '';
            document.getElementById('progressFill').style.width = '0%';
            showScreen('screenHome');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');
            if (codeFromUrl && codeFromUrl.length === 3) {
                startReceiving(codeFromUrl.toUpperCase());
            }
        });
    </script>
</body>
</html>
