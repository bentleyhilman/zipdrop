<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipDrop | Simple File Sharing</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF9F6; /* Cream */
            --text-color: #2C1E16; /* Dark Brown/Black */
            --accent-color: #4A3B32; /* Lighter Brown */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        p {
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        /* Receive Section */
        .receive-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(74, 59, 50, 0.2);
        }

        input[type="text"] {
            font-size: 1.2rem;
            padding: 12px;
            width: 120px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            letter-spacing: 2px;
        }

        button {
            font-size: 1.1rem;
            padding: 13px 24px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        /* Send Section */
        .drop-zone {
            border: 2px dashed var(--text-color);
            border-radius: 12px;
            padding: 50px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: rgba(74, 59, 50, 0.05);
        }

        #fileInput {
            display: none;
        }

        .status {
            margin-top: 25px;
            font-weight: 500;
            font-size: 1.1rem;
            min-height: 24px;
        }

        .code-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0 5px 0;
            letter-spacing: 4px;
        }

        /* QR Code Container */
        #qrcode {
            margin: 20px auto 10px auto;
            display: flex;
            justify-content: center;
            padding: 12px;
            background-color: #FFFFFF;
            border-radius: 8px;
            width: fit-content;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        #qrcode img {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ZipDrop</h1>
        <p>Peer-to-peer file transfer.</p>

        <div class="receive-section">
            <h3>Download a File</h3>
            <input type="text" id="codeInput" placeholder="XYZ" maxlength="3">
            <button onclick="receiveFile()">Drop It</button>
        </div>

        <div class="send-section" id="sendSection">
            <h3>Send a File</h3>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                Click here or drag and drop a file to upload.
            </div>
            <input type="file" id="fileInput">
        </div>

        <div id="statusText" class="status"></div>
        <div id="codeDisplay" class="code-display"></div>
        <div id="qrcode"></div>
    </div>

    <script>
        const PREFIX = 'zipdrop-v1-';
        let peer = null;
        let fileToShare = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const codeInput = document.getElementById('codeInput');
        const statusText = document.getElementById('statusText');
        const codeDisplay = document.getElementById('codeDisplay');
        const qrContainer = document.getElementById('qrcode');

        function setStatus(msg) {
            statusText.innerText = msg;
        }

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Drag and drop setup
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            fileToShare = file;
            startHosting();
        }

        // Host the file and render the QR code
        function startHosting() {
            setStatus("Generating code & QR...");
            const code = generateCode();
            
            if (peer) peer.destroy();

            peer = new Peer(PREFIX + code);

            peer.on('open', () => {
                setStatus("Ready! Scan QR or give code to receiver. Keep tab open.");
                codeDisplay.innerText = code;
                dropZone.style.display = "none";

                // Generate full shareable URL
                const baseUrl = window.location.href.split('?')[0];
                const shareableUrl = `${baseUrl}?code=${code}`;

                // Clear previous QR and generate new one
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: shareableUrl,
                    width: 160,
                    height: 160,
                    colorDark: "#2C1E16",
                    colorLight: "#FFFFFF",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });

            peer.on('connection', (conn) => {
                setStatus("Receiver connected! Sending file...");
                
                conn.on('open', () => {
                    conn.send({
                        file: fileToShare,
                        filename: fileToShare.name,
                        filetype: fileToShare.type
                    });
                });

                conn.on('data', (data) => {
                    if (data === 'SUCCESS') {
                        setStatus("Transfer complete!");
                    }
                });
            });

            peer.on('error', (err) => {
                setStatus("Connection error occurred.");
                console.error(err);
            });
        }

        // Receive file logic
        function receiveFile(targetCode = null) {
            const code = (targetCode || codeInput.value).toUpperCase();
            if (code.length !== 3) {
                setStatus("Please enter a valid 3-character code.");
                return;
            }

            codeInput.value = code;
            setStatus("Connecting to sender...");
            
            if (peer) peer.destroy();
            peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(PREFIX + code);
                
                conn.on('open', () => {
                    setStatus("Connected! Downloading file...");
                });

                conn.on('data', (data) => {
                    const blob = new Blob([data.file], { type: data.filetype });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    setStatus("Download complete!");
                    conn.send('SUCCESS');
                });
            });

            peer.on('error', (err) => {
                setStatus("Could not find sender. Make sure their tab is open!");
            });
        }

        // Auto-detect code from URL parameter when scanned via QR code
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');
            
            if (codeFromUrl && codeFromUrl.length === 3) {
                receiveFile(codeFromUrl);
            }
        });
    </script>
</body>
</html>
