<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipDrop | Simple File Sharing</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF9F6; /* Cream */
            --text-color: #2C1E16; /* Dark Brown/Black */
            --accent-color: #4A3B32; /* Lighter Brown */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        p {
            color: var(--accent-color);
            margin-bottom: 40px;
        }

        /* Receive Section */
        .receive-section {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid rgba(74, 59, 50, 0.2);
        }

        input[type="text"] {
            font-size: 1.2rem;
            padding: 12px;
            width: 120px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 8px;
            outline: none;
            letter-spacing: 2px;
        }

        button {
            font-size: 1.1rem;
            padding: 13px 24px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 10px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        /* Send Section */
        .drop-zone {
            border: 2px dashed var(--text-color);
            border-radius: 12px;
            padding: 60px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: rgba(74, 59, 50, 0.05);
        }

        #fileInput {
            display: none;
        }

        .status {
            margin-top: 25px;
            font-weight: 500;
            font-size: 1.1rem;
            min-height: 24px;
        }

        .code-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ZipDrop</h1>
        <p>Peer-to-peer file transfer.</p>

        <div class="receive-section">
            <h3>Download a File</h3>
            <input type="text" id="codeInput" placeholder="XYZ" maxlength="3">
            <button onclick="receiveFile()">Drop It</button>
        </div>

        <div class="send-section">
            <h3>Send a File</h3>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                Click here or drag and drop a file to upload.
            </div>
            <input type="file" id="fileInput">
        </div>

        <div id="statusText" class="status"></div>
        <div id="codeDisplay" class="code-display"></div>
    </div>

    <script>
        const PREFIX = 'zipdrop-v1-'; // Prevents global PeerJS collisions
        let peer = null;
        let fileToShare = null;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const codeInput = document.getElementById('codeInput');
        const statusText = document.getElementById('statusText');
        const codeDisplay = document.getElementById('codeDisplay');

        // Helper: Update UI text
        function setStatus(msg) {
            statusText.innerText = msg;
        }

        // Helper: Generate 3-digit alphanumeric code
        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Drag and Drop Event Listeners
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // Step 1: User selects a file to SEND
        function handleFileSelect(file) {
            fileToShare = file;
            startHosting();
        }

        // Step 2: Initialize PeerJS and wait for connection
        function startHosting() {
            setStatus("Generating secure code...");
            const code = generateCode();
            
            // Clean up old connection if exists
            if (peer) peer.destroy();

            peer = new Peer(PREFIX + code);

            peer.on('open', () => {
                setStatus("Ready! Give this code to the receiver. Keep this tab open.");
                codeDisplay.innerText = code;
                dropZone.style.display = "none"; // Hide drop zone once hosting
            });

            peer.on('connection', (conn) => {
                setStatus("Receiver connecting...");
                
                conn.on('open', () => {
                    setStatus("Sending: " + fileToShare.name + "...");
                    conn.send({
                        file: fileToShare,
                        filename: fileToShare.name,
                        filetype: fileToShare.type
                    });
                });

                // Optional: Listen for success message back from receiver
                conn.on('data', (data) => {
                    if (data === 'SUCCESS') {
                        setStatus("Transfer complete!");
                    }
                });
            });

            peer.on('error', (err) => {
                setStatus("Connection error occurred.");
                console.error(err);
            });
        }

        // Step 3: User enters a code to RECEIVE
        function receiveFile() {
            const code = codeInput.value.toUpperCase();
            if (code.length !== 3) {
                setStatus("Please enter a valid 3-character code.");
                return;
            }

            setStatus("Looking for sender...");
            
            if (peer) peer.destroy();
            peer = new Peer(); // Create random peer for the receiver

            peer.on('open', () => {
                const conn = peer.connect(PREFIX + code);
                
                conn.on('open', () => {
                    setStatus("Connected! Awaiting file...");
                });

                conn.on('data', (data) => {
                    setStatus("Receiving file...");
                    
                    // Convert received data back to a file and trigger download
                    const blob = new Blob([data.file], { type: data.filetype });
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    setStatus("Download complete!");
                    conn.send('SUCCESS'); // Tell sender we got it
                });
            });

            peer.on('error', (err) => {
                setStatus("Could not find that code, or sender closed their tab.");
            });
        }
    </script>
</body>
</html>
