<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipDrop</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF9F6;
            --text-color: #2C1E16;
            --accent-color: #8C7A6B;
            --subtle-border: rgba(44, 30, 22, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* Screen Management */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.98);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Full Screen Drag Overlay */
        #dragOverlay {
            position: fixed;
            inset: 0;
            background-color: rgba(250, 249, 246, 0.92);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--text-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            border: 2px dashed var(--text-color);
        }

        #dragOverlay.visible {
            opacity: 1;
        }

        /* Typography */
        .brand-logo {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-top: 20px;
        }

        .status-heading {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-color);
            letter-spacing: 0.5px;
        }

        .big-code {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: 8px;
            line-height: 1;
            margin: 16px 0 24px 0;
        }

        /* Inputs & Buttons */
        .code-input-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        input[type="text"] {
            font-size: 2rem;
            font-weight: 600;
            padding: 16px 24px;
            width: 180px;
            text-align: center;
            text-transform: uppercase;
            border: none;
            border-bottom: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            outline: none;
            letter-spacing: 6px;
            transition: border-color 0.2s;
        }

        input[type="text"]::placeholder {
            color: var(--subtle-border);
            letter-spacing: 6px;
        }

        .btn {
            font-size: 0.95rem;
            font-weight: 600;
            padding: 16px 36px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.15s ease, opacity 0.2s ease;
            outline: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--subtle-border);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .center-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            margin: auto;
        }

        /* QR Frame */
        #qrcode {
            padding: 16px;
            background-color: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 30, 22, 0.05);
            margin-bottom: 24px;
        }

        #qrcode img {
            display: block;
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            max-width: 280px;
            height: 4px;
            background-color: var(--subtle-border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 24px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--text-color);
            transition: width 0.15s ease-out;
        }

        .pulse {
            animation: pulse-animation 1.8s infinite ease-in-out;
        }

        @keyframes pulse-animation {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div id="dragOverlay">DROP FILE TO SEND</div>
    <input type="file" id="fileInput">

    <div id="screenHome" class="screen active">
        <div class="brand-logo">ZipDrop</div>
        
        <div class="center-card">
            <div class="code-input-wrap">
                <input type="text" id="codeInput" placeholder="···" maxlength="3" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <button class="btn" onclick="document.getElementById('fileInput').click()">Upload File</button>
    </div>

    <div id="screenSendCode" class="screen">
        <div></div>
        <div class="center-card">
            <div id="qrcode"></div>
            <div class="big-code" id="displayCode">---</div>
            <div class="status-heading pulse">Waiting for receiver...</div>
        </div>
        <button class="btn btn-secondary" onclick="resetToHome()">Cancel</button>
    </div>

    <div id="screenConnecting" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading pulse">Connecting across networks...</div>
        </div>
        <div></div>
    </div>

    <div id="screenTransferring" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading" id="transferLabel">Transferring...</div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div></div>
    </div>

    <div id="screenSendSuccess" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading">Sent</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="shareAgain()">Share Again</button>
            <button class="btn" onclick="resetToHome()">Home</button>
        </div>
    </div>

    <div id="screenReceiveSuccess" class="screen">
        <div></div>
        <div class="center-card">
            <div class="status-heading">Downloaded</div>
        </div>
        <button class="btn" onclick="resetToHome()">Home</button>
    </div>

    <script>
        const PREFIX = 'zipdrop-v4-';
        const CHUNK_SIZE = 64 * 1024;
        
        // Multi-network ICE configuration (STUN + TURN relays)
        const peerIceConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    {
                        urls: 'turn:openrelay.metered.ca:80',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    },
                    {
                        urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ]
            }
        };

        let peer = null;
        let activeConn = null;
        let fileToShare = null;
        let currentCode = '';

        const dragOverlay = document.getElementById('dragOverlay');
        const fileInput = document.getElementById('fileInput');
        const codeInput = document.getElementById('codeInput');
        const qrContainer = document.getElementById('qrcode');

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 3; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Fullscreen Drag & Drop
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragOverlay.classList.add('visible');
        });

        window.addEventListener('dragleave', (e) => {
            if (e.clientX === 0 && e.clientY === 0) {
                dragOverlay.classList.remove('visible');
            }
        });

        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dragOverlay.classList.remove('visible');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // Auto-Submit Code Entry
        codeInput.addEventListener('input', (e) => {
            const val = e.target.value.toUpperCase();
            e.target.value = val;
            if (val.length === 3) {
                startReceiving(val);
            }
        });

        // Sender Flow
        function handleFileSelect(file) {
            fileToShare = file;
            startHosting();
        }

        function startHosting() {
            currentCode = generateCode();
            document.getElementById('displayCode').innerText = currentCode;

            const baseUrl = window.location.href.split('?')[0];
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: `${baseUrl}?code=${currentCode}`,
                width: 140,
                height: 140,
                colorDark: "#2C1E16",
                colorLight: "#FFFFFF",
                correctLevel: QRCode.CorrectLevel.H
            });

            showScreen('screenSendCode');

            if (peer) peer.destroy();
            peer = new Peer(PREFIX + currentCode, peerIceConfig);

            peer.on('connection', (conn) => {
                activeConn = conn;
                showScreen('screenConnecting');

                conn.on('open', async () => {
                    showScreen('screenTransferring');
                    document.getElementById('transferLabel').innerText = "Sending...";
                    
                    conn.send({
                        type: 'meta',
                        filename: fileToShare.name,
                        filetype: fileToShare.type,
                        filesize: fileToShare.size
                    });

                    let offset = 0;
                    const totalSize = fileToShare.size;

                    while (offset < totalSize) {
                        if (conn.dataChannel && conn.dataChannel.bufferedAmount > 8 * 1024 * 1024) {
                            await new Promise(r => setTimeout(r, 50));
                            continue;
                        }

                        const slice = fileToShare.slice(offset, offset + CHUNK_SIZE);
                        const buffer = await slice.arrayBuffer();
                        conn.send(buffer);

                        offset += CHUNK_SIZE;
                        const progress = Math.min(100, (offset / totalSize) * 100);
                        document.getElementById('progressFill').style.width = `${progress}%`;
                    }

                    showScreen('screenSendSuccess');
                });
            });
        }

        function shareAgain() {
            startHosting();
        }

        // Receiver Flow
        function startReceiving(code) {
            showScreen('screenConnecting');

            if (peer) peer.destroy();
            peer = new Peer(peerIceConfig);

            peer.on('open', () => {
                const conn = peer.connect(PREFIX + code);
                
                let fileMeta = null;
                let receivedBytes = 0;
                let chunks = [];

                conn.on('open', () => {
                    showScreen('screenTransferring');
                    document.getElementById('transferLabel').innerText = "Downloading...";
                });

                conn.on('data', (data) => {
                    if (data && data.type === 'meta') {
                        fileMeta = data;
                        return;
                    }

                    chunks.push(data);
                    receivedBytes += data.byteLength;

                    if (fileMeta) {
                        const progress = Math.min(100, (receivedBytes / fileMeta.filesize) * 100);
                        document.getElementById('progressFill').style.width = `${progress}%`;
                    }

                    if (fileMeta && receivedBytes >= fileMeta.filesize) {
                        const blob = new Blob(chunks, { type: fileMeta.filetype });
                        const url = URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileMeta.filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        showScreen('screenReceiveSuccess');
                    }
                });
            });

            peer.on('error', () => {
                alert("Connection failed. Check code or sender tab.");
                resetToHome();
            });
        }

        function resetToHome() {
            if (peer) peer.destroy();
            fileToShare = null;
            activeConn = null;
            codeInput.value = '';
            document.getElementById('progressFill').style.width = '0%';
            showScreen('screenHome');
        }

        // Auto-connect from URL Scan
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');
            if (codeFromUrl && codeFromUrl.length === 3) {
                startReceiving(codeFromUrl.toUpperCase());
            }
        });
    </script>
</body>
</html>
